<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#46c27a"/>
      <stop offset="1" stop-color="#17703d"/>
    </linearGradient>
    <radialGradient id="sky" cx=".3" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".66"/>
    </linearGradient>
    <linearGradient id="clear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <!-- Edge light: bright at the top-left, faint at the bottom-right -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".75"/>
    </linearGradient>
    <clipPath id="tile-shape" clipPathUnits="objectBoundingBox">
      <rect width="1" height="1" rx=".25" ry=".192"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>

  <!-- The wait: an empty, clear glass tile -->
  <g transform="translate(34 16.4) scale(.6)">
    <rect y="2.5" width="40" height="52" rx="10" fill="#063d1c" opacity=".12" filter="url(#shadow)"/>
    <rect width="40" height="52" rx="10" fill="url(#clear)"/>
    <g clip-path="url(#tile-shape)">
      <rect width="40" height="52" rx="10" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="5" filter="url(#glow)"/>
    </g>
    <rect x=".4" y=".4" width="39.2" height="51.2" rx="9.6" fill="none" stroke="url(#rim)" stroke-width="1"/>
  </g>

  <!-- The tile in hand: frosted glass 白板 -->
  <g transform="translate(6 16.4) scale(.6)">
    <rect y="2.5" width="40" height="52" rx="10" fill="#063d1c" opacity=".22" filter="url(#shadow)"/>
    <rect width="40" height="52" rx="10" fill="url(#frost)"/>
    <g clip-path="url(#tile-shape)">
      <rect width="40" height="52" rx="10" fill="none" stroke="#fff" stroke-width="4" filter="url(#glow)"/>
    </g>
    <rect x=".4" y=".4" width="39.2" height="51.2" rx="9.6" fill="none" stroke="url(#rim)" stroke-width=".9"/>
    <rect x="8" y="9" width="24" height="34" rx="4" fill="none" stroke="#1a5fb4" stroke-width="3"/>
  </g>
</svg>
