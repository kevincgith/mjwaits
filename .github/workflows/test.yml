name: Test

# Lint, tests and the production build on every pull request - the same
# checks deploy.yml runs before publishing, so a PR shows whether merging it
# would deploy. Nothing is deployed from here.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler and the Workers test runtime (npm test) need 22+
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
