<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Run</title>
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3ef;
  --surface-1: #fcfcfb;
  --border: #e2e0da;
  --grid: #ebe9e3;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7b7a75;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --good: #1f8a4c;
  --warn: #b26b00;
  --bad: #c43c3b;
  --bar-bg: #ebe9e3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211;
    --surface-1: #1a1a19;
    --border: #2e2d2b;
    --grid: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-2: #d95926;
    --good: #3fb36f;
    --warn: #d99a2b;
    --bad: #e66767;
    --bar-bg: #2a2a28;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211;
  --surface-1: #1a1a19;
  --border: #2e2d2b;
  --grid: #262624;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #8f8e86;
  --series-1: #3987e5;
  --series-2: #d95926;
  --good: #3fb36f;
  --warn: #d99a2b;
  --bad: #e66767;
  --bar-bg: #2a2a28;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface-0);
  color: var(--text-primary);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface-1);
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.running { color: var(--good); }
.pill.paused { color: var(--warn); }
.pill.stopped { color: var(--text-muted); }
.controls { margin-left: auto; display: flex; gap: 8px; }
button {
  font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
}
button:hover { border-color: var(--text-muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; overflow-wrap: anywhere; }
.step { grid-column: span 4; }
.step-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stages { display: flex; gap: 6px; margin: 12px 0 10px; }
.stage { flex: 1; text-align: center; font-size: 12px; padding: 5px 0; border-radius: 6px; background: var(--bar-bg); color: var(--text-muted); }
.stage.done { color: var(--text-secondary); }
.stage.now { background: var(--text-primary); color: var(--surface-1); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
.bar > div { height: 100%; background: var(--series-1); border-radius: 4px; transition: width .4s; }
h2 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--series-1); }
.sw-line { width: 16px; height: 2px; background: var(--series-2); }
.chart-wrap { position: relative; }
svg { display: block; width: 100%; height: 260px; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 12px; box-shadow: 0 4px 14px rgb(0 0 0 / .12); display: none; max-width: 260px;
}
.tip b { font-variant-numeric: tabular-nums; }
.empty { color: var(--text-muted); font-size: 13px; padding: 40px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--text-secondary); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; }
.tag { font-size: 11px; font-weight: 600; color: var(--good); }
.log { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text-secondary); max-height: 300px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.log b { color: var(--text-muted); font-weight: 400; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.foot { margin-top: 14px; font-size: 12px; color: var(--text-muted); }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .step { grid-column: span 2; }
  .two { grid-template-columns: 1fr; }
  .controls { margin-left: 0; width: 100%; }
  .controls button { flex: 1; }
}
.run { margin-bottom: 36px; }
.run-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.run-head h2 { font-size: 18px; margin: 0; }
.about { color: var(--text-secondary); font-size: 13px; margin: 0 0 14px; }
.page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin-right: auto; }
.chart-title { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
</style>
</head>
<body>
<main>
  <div class="page-head">
    <h1>MJWaits training</h1>
    <span class="sub" id="load"></span>
  </div>
  <div id="runs"></div>
  <div class="foot" id="foot"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
let last = null;

async function ctl(key, cmd) {
  document.querySelectorAll(`[data-run="${key}"] button`).forEach((b) => (b.disabled = true));
  try { await fetch(`/ctl/${key}/${cmd}`, { method: "POST" }); } catch {}
  refresh();
}

function section(key) {
  let el = document.querySelector(`.run[data-run="${key}"]`);
  if (el) return el;
  el = document.createElement("section");
  el.className = "run";
  el.dataset.run = key;
  el.innerHTML = `
    <div class="run-head">
      <h2>${key}</h2>
      <span class="pill stopped" data-f="pill"><i></i><span>…</span></span>
      <div class="controls">
        <button data-f="pause">Pause</button>
        <button data-f="resume" class="primary">Resume</button>
      </div>
    </div>
    <p class="about" data-f="about"></p>
    <div class="grid">
      <div class="card"><div class="label">Best network</div><div class="big" data-f="best">–</div><div class="sub" data-f="bestName"></div></div>
      <div class="card"><div class="label" data-f="secondLabel">Starting score</div><div class="big" data-f="second">–</div><div class="sub" data-f="secondSub"></div></div>
      <div class="card"><div class="label">Self-play rounds finished</div><div class="big" data-f="rounds">–</div><div class="sub" data-f="kept"></div></div>
      <div class="card"><div class="label">Running since</div><div class="big" data-f="since" style="font-size:20px">–</div><div class="sub" data-f="backup"></div></div>
      <div class="card step">
        <div class="step-head">
          <div><div class="label">Now</div><h2 data-f="stepTitle">–</h2></div>
          <div style="text-align:right"><div class="label" data-f="chunksLabel">Self-play chunks</div><div data-f="chunks" style="font-weight:600;font-variant-numeric:tabular-nums">–</div></div>
        </div>
        <div class="stages" data-f="stages"></div>
        <div class="bar"><div data-f="bar" style="width:0"></div></div>
        <div class="sub" data-f="stepNote"></div>
      </div>
    </div>
    <div class="card">
      <div class="chart-title" data-f="metric"></div>
      <div class="sub" data-f="metricNote"></div>
      <div class="legend"><span><i class="sw-dot"></i>Step score</span><span><i class="sw-line"></i>Best so far</span></div>
      <div class="chart-wrap"><svg data-f="chart" role="img"></svg><div class="tip" data-f="tip"></div></div>
    </div>
    <div class="two">
      <div class="card">
        <h2>Steps</h2>
        <table><thead><tr><th>Step</th><th>Finished</th><th class="num">Score</th><th></th></tr></thead><tbody data-f="rows"></tbody></table>
      </div>
      <div class="card">
        <h2>Log</h2>
        <div class="log" data-f="log"></div>
      </div>
    </div>`;
  el.querySelector('[data-f="pause"]').onclick = () => ctl(key, "pause");
  el.querySelector('[data-f="resume"]').onclick = () => {
    const r = last && last.runs.find((x) => x.key === key);
    ctl(key, r && r.run === "not running" ? "start" : "resume");
  };
  $("runs").appendChild(el);
  return el;
}

function shortName(n) {
  if (n === "tile1" || n === "matchday-copy") return "Copy";
  if (n === "dagger1" || n === "matchday-corrected") return "Corrected";
  const m = n.match(/(?:long|matchday-round)-(\d+)$/);
  return m ? "R" + m[1] : n;
}

function renderChart(svg, tip, scores) {
  const W = svg.clientWidth || 900, H = 240, L = 48, R = 12, T = 12, B = 28;
  if (!scores.length) {
    svg.innerHTML = `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="13" fill="var(--text-muted)">No scores yet</text>`;
    return;
  }
  const best = [];
  let b = -Infinity;
  for (const s of scores) { b = Math.max(b, s.score); best.push(b); }
  const vals = scores.map((s) => s.score).concat(0);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(0.5, (hi - lo) * 0.15);
  lo = Math.floor((lo - pad) * 2) / 2; hi = Math.ceil((hi + pad) * 2) / 2;
  const x = (i) => scores.length === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (scores.length - 1);
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  const step = (hi - lo) <= 3 ? 0.5 : (hi - lo) <= 8 ? 1 : (hi - lo) <= 20 ? 2 : 5;
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) {
    const zero = Math.abs(v) < 1e-9;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(${zero ? "--text-muted" : "--grid"})" stroke-width="1" ${zero ? 'stroke-dasharray="3 3"' : ""}/>`;
    g += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${fmt(v)}</text>`;
  }
  scores.forEach((s, i) => { g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${shortName(s.name)}</text>`; });
  let d = scores.length === 1 ? `M${L} ${y(best[0])} H${W - R}` : "";
  if (scores.length > 1) best.forEach((v, i) => { d += i ? ` H${x(i)} V${y(v)}` : `M${x(i)} ${y(v)}`; });
  g += `<path d="${d}" fill="none" stroke="var(--series-2)" stroke-width="2"/>`;
  scores.forEach((s, i) => {
    g += `<circle cx="${x(i)}" cy="${y(s.score)}" r="5" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"/>`;
    g += `<circle class="hit" data-i="${i}" cx="${x(i)}" cy="${y(s.score)}" r="16" fill="transparent"/>`;
  });
  const li = scores.length - 1;
  g += `<text x="${Math.min(x(li) + 8, W - R)}" y="${y(best[li]) - 8}" text-anchor="${scores.length > 1 ? "end" : "middle"}" font-size="11" fill="var(--text-secondary)">best ${fmt(best[li])}</text>`;
  svg.innerHTML = g;
  svg.querySelectorAll(".hit").forEach((c) => {
    c.addEventListener("mouseenter", () => {
      const i = +c.dataset.i, s = scores[i];
      tip.innerHTML = `<b>${esc(s.label)}</b> · ${s.at}<br>${s.desc ? esc(s.desc) + "<br>" : ""}Score <b>${fmt(s.score)}</b>${s.first != null ? ` · 1st on <b>${s.first}%</b> of days` : ""}${s.best ? " · new best" : ""}<br>Best so far <b>${fmt(best[i])}</b>`;
      tip.style.display = "block";
      const cx = +c.getAttribute("cx"), cy = +c.getAttribute("cy");
      tip.style.left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), W - tip.offsetWidth) + "px";
      tip.style.top = Math.max(cy - tip.offsetHeight - 12, 0) + "px";
    });
    c.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

function renderRun(r) {
  const el = section(r.key);
  const f = (name) => el.querySelector(`[data-f="${name}"]`);
  const run = r.run === "running" ? "running" : r.run === "paused" ? "paused" : "stopped";
  f("pill").className = "pill " + run;
  f("pill").lastElementChild.textContent = run === "running" ? "Running" : run === "paused" ? "Paused" : "Not running";
  f("pause").disabled = run !== "running";
  f("resume").disabled = run === "running";
  f("resume").textContent = run === "stopped" ? "Start" : "Resume";
  f("about").textContent = r.about;

  const st = r.state || {};
  const scores = r.scores || [];
  f("best").textContent = st.best_score && st.best ? fmt(+st.best_score) : "–";
  f("bestName").textContent = st.best ? `${st.bestLabel} (${st.best.split("/").pop()})` + (st.bestFirst != null ? ` · 1st on ${st.bestFirst}% of days` : "") : "not yet";
  f("secondLabel").textContent = r.key === "perHand" ? "Starting score (rule-bot copy)" : "1st-place rate (best)";
  if (r.key === "perHand") {
    f("second").textContent = scores.length ? fmt(scores[0].score) : "–";
    f("secondSub").textContent = "net tai / hand vs rule bots";
  } else {
    f("second").textContent = st.bestFirst != null ? st.bestFirst + "%" : "–";
    f("secondSub").textContent = "of 64-hand match days won (25% = even)";
  }
  const rounds = scores.filter((x) => /(long|matchday-round)-\d+$/.test(x.name)).length;
  f("rounds").textContent = rounds;
  const later = scores.slice(1);
  f("kept").textContent = later.length ? `${later.filter((x) => x.best).length} of ${later.length} steps became the best` : "copy, correct, then self-play rounds";
  f("since").textContent = r.started || "–";
  f("backup").textContent = r.backup ? `iCloud backup ${r.backup}` : "no backup yet";

  const step = r.step;
  f("stepTitle").textContent = step ? step.title : "–";
  const idx = !step ? -1 : { "self-play": 0, training: 1, scoring: 2 }[step.stage];
  f("stages").innerHTML = step ? step.stages.map((n, i) => `<div class="stage ${i < idx ? "done" : i === Math.min(idx, step.stages.length - 1) ? "now" : ""}">${n}</div>`).join("") : "";
  const hasChunks = step && step.data;
  f("chunksLabel").style.visibility = f("chunks").style.visibility = hasChunks ? "visible" : "hidden";
  let frac = 0, note = "";
  if (step) {
    const training = step.stage === "training" && step.epochs;
    if (hasChunks && step.stage === "self-play") {
      frac = step.chunksDone / step.chunks;
      note = `${(step.chunksDone * 1000).toLocaleString()} of ${step.hands.toLocaleString()} hands played`;
    } else if (training) {
      frac = step.epoch / step.epochs;
      note = `Training: epoch ${step.epoch} of ${step.epochs} done` + (step.epoch ? ` · about ${Math.round(step.epochSecs / step.epoch / 60)} min per epoch` : "");
    } else if (step.stage === "training") {
      note = "Training";
    } else if (step.stage === "scoring") {
      frac = 1;
      note = "Scoring on the arena hands";
    } else {
      note = "Playing (no progress count for this step)";
    }
    note += ` · step started ${step.since}` + (step.chunkFails ? ` · ${step.chunkFails} chunk crash${step.chunkFails > 1 ? "es" : ""} retried` : "");
    f("chunks").textContent = `${step.chunksDone} / ${step.chunks}`;
  }
  f("bar").style.width = Math.round(frac * 100) + "%";
  f("stepNote").textContent = note;

  f("metric").textContent = r.metric;
  f("metricNote").textContent = r.metricNote;
  f("chart").setAttribute("aria-label", `${r.key}: ${r.metric} per training step`);
  renderChart(f("chart"), f("tip"), scores);
  f("rows").innerHTML = scores.length
    ? scores.slice().reverse().map((x) => `<tr><td>${esc(x.label)}<div class="sub">${x.name}</div></td><td>${x.at}</td><td class="num">${fmt(x.score)}${x.first != null ? `<div class="sub">1st ${x.first}%</div>` : ""}</td><td>${x.best ? '<span class="tag">new best</span>' : ""}</td></tr>`).join("")
    : `<tr><td colspan="4" class="empty">No scores yet</td></tr>`;
  const logEl = f("log");
  const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
  logEl.innerHTML = (r.log || []).map((e) => `<b>${e.at}</b> ${esc(e.msg)}`).join("\n");
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}

function render(s) {
  last = s;
  s.runs.forEach(renderRun);
  $("load").textContent = `Training is using ${s.cpuTraining} of ${s.cpus} cores (everything: ${s.cpuTotal})`;
  $("foot").textContent = `Updated ${s.now}`;
}

async function refresh() {
  try { render(await (await fetch("/status", { cache: "no-store" })).json()); }
  catch { $("foot").textContent = "Dashboard server not reachable"; }
}
refresh();
setInterval(refresh, 5000);
addEventListener("resize", () => last && last.runs.forEach((r) => renderChart(section(r.key).querySelector('[data-f="chart"]'), section(r.key).querySelector('[data-f="tip"]'), r.scores || [])));
</script>
</body>
</html>
